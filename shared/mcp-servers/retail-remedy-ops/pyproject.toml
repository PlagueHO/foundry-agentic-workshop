[project]
name = "mcp-server-retail-remedy-ops"
version = "0.1.0"
description = "Retail Remedy Operations MCP server container image dependencies."
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
]

[dependency-groups]
test = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["src"]
testpaths = ["src"]
