[project]
name = "mcp-server-flight-ops"
version = "0.1.0"
description = "Flight Operations MCP server container image dependencies."
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=1.28.1,<3.0.0",
]

[dependency-groups]
test = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["src"]
testpaths = ["src"]
