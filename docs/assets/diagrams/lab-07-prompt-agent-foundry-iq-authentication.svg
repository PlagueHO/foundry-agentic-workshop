<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470" role="img" aria-labelledby="title desc">
  <title id="title">Module 07 Prompt Agent authentication to Foundry IQ</title>
  <desc id="desc">A user asks a Prompt Agent a product or policy question. Foundry Agent Service resolves the knowledge base project connection, uses the project managed identity to send an MCP request to Azure AI Search Foundry IQ, and returns grounded passages and citations to the agent.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 12 4, 0 8" fill="#0078D4"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 12 4, 0 8" fill="#107C10"/>
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 12 4, 0 8" fill="#5C2D91"/>
    </marker>
  </defs>

  <rect width="1080" height="470" fill="#FFFFFF"/>
  <text x="540" y="30" text-anchor="middle" fill="#1B1A19" font-family="'Segoe UI', Arial, sans-serif" font-size="19" font-weight="bold">Module 07: Prompt Agent authentication to Foundry IQ</text>
  <text x="540" y="55" text-anchor="middle" fill="#605E5C" font-family="'Segoe UI', Arial, sans-serif" font-size="13">Foundry resolves the project connection and attaches the Azure AI Search token.</text>

  <rect x="34" y="98" width="172" height="72" rx="6" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
  <text x="120" y="129" text-anchor="middle" fill="#1B1A19" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold">User</text>
  <text x="120" y="149" text-anchor="middle" fill="#323130" font-family="'Segoe UI', Arial, sans-serif" font-size="12">product or policy question</text>

  <rect x="246" y="98" width="172" height="72" rx="6" fill="#FFF3CD" stroke="#F59E0B" stroke-width="2"/>
  <text x="332" y="129" text-anchor="middle" fill="#1B1A19" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold">Prompt Agent</text>
  <text x="332" y="149" text-anchor="middle" fill="#323130" font-family="'Segoe UI', Arial, sans-serif" font-size="12">acl-remedy-advisor</text>

  <rect x="458" y="98" width="172" height="72" rx="6" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/>
  <text x="544" y="123" text-anchor="middle" fill="#1B1A19" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold">Foundry Agent</text>
  <text x="544" y="142" text-anchor="middle" fill="#1B1A19" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold">Service</text>
  <text x="544" y="160" text-anchor="middle" fill="#323130" font-family="'Segoe UI', Arial, sans-serif" font-size="11">declarative tool runtime</text>

  <rect x="670" y="98" width="172" height="72" rx="6" fill="#E0F7FA" stroke="#006064" stroke-width="2"/>
  <text x="756" y="123" text-anchor="middle" fill="#1B1A19" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold">Project connection</text>
  <text x="756" y="145" text-anchor="middle" fill="#323130" font-family="'Segoe UI', Arial, sans-serif" font-size="12">ProjectManagedIdentity</text>

  <rect x="882" y="98" width="172" height="72" rx="6" fill="#E8F5E9" stroke="#107C10" stroke-width="2"/>
  <text x="968" y="123" text-anchor="middle" fill="#1B1A19" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold">Azure AI Search</text>
  <text x="968" y="143" text-anchor="middle" fill="#1B1A19" font-family="'Segoe UI', Arial, sans-serif" font-size="12">Foundry IQ MCP endpoint</text>
  <text x="968" y="160" text-anchor="middle" fill="#323130" font-family="'Segoe UI', Arial, sans-serif" font-size="11">knowledge_base_retrieve</text>

  <line x1="206" y1="134" x2="244" y2="134" stroke="#0078D4" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="225" y="190" text-anchor="middle" fill="#0078D4" font-family="'Segoe UI', Arial, sans-serif" font-size="11">1. Ask</text>

  <line x1="418" y1="134" x2="456" y2="134" stroke="#5C2D91" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="437" y="190" text-anchor="middle" fill="#5C2D91" font-family="'Segoe UI', Arial, sans-serif" font-size="11">2. Retrieve</text>

  <line x1="630" y1="134" x2="668" y2="134" stroke="#5C2D91" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="649" y="190" text-anchor="middle" fill="#5C2D91" font-family="'Segoe UI', Arial, sans-serif" font-size="11">3. Resolve</text>

  <line x1="842" y1="134" x2="880" y2="134" stroke="#107C10" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="861" y="190" text-anchor="middle" fill="#107C10" font-family="'Segoe UI', Arial, sans-serif" font-size="11">4. MCP request</text>

  <rect x="230" y="222" width="620" height="94" rx="6" fill="#F3F2F1" stroke="#8A8886" stroke-width="1.5"/>
  <text x="540" y="251" text-anchor="middle" fill="#1B1A19" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="bold">Authentication responsibility</text>
  <text x="540" y="276" text-anchor="middle" fill="#323130" font-family="'Segoe UI', Arial, sans-serif" font-size="13">Foundry Agent Service reads the connection's auth type, obtains a token as the</text>
  <text x="540" y="296" text-anchor="middle" fill="#323130" font-family="'Segoe UI', Arial, sans-serif" font-size="13">Foundry project managed identity, and attaches it to the Azure AI Search request.</text>

  <path d="M 968,170 L 968,358 L 120,358 L 120,172" fill="none" stroke="#107C10" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="544" y="348" text-anchor="middle" fill="#107C10" font-family="'Segoe UI', Arial, sans-serif" font-size="13">5. Grounded passages and citations return to the agent, then the user receives a grounded answer.</text>

  <rect x="168" y="398" width="744" height="44" rx="5" fill="#FFF4CE" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="540" y="425" text-anchor="middle" fill="#323130" font-family="'Segoe UI', Arial, sans-serif" font-size="13"><tspan font-weight="bold">Required role:</tspan> The project managed identity has Search Index Data Reader on Azure AI Search.</text>
</svg>
